      - run:
          name: Name mount
          command: |
            printf 'mount /data\n' > btrfs.cfg
      - run:
          name: Build filesystem tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target btrfsBalance -j2
      - run:
          name: Balance btrfs chunks
          command: LIONSS_LP=1 ./build/btrfsBalance --conf btrfs.cfg --dusage 50
  riscv-mret:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write trap handler
          command: |
            printf 'csrr t0 mcause\n' > trap.s
      - run:
          name: Assemble trap vector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target riscv-mret -j2
      - run:
          name: Return from machine trap
          command: LIONSS_LP=1 ./build/riscv-mret --in trap.s --xlen 32
  lightmap_uv2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
